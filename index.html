<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Controle de Compras</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="mudarAba('Zanol & Thomaz', this)">ZANOL & THOMAZ</button>
        <button class="tab-btn" onclick="mudarAba('Cella', this)">CELLA</button>
        <button class="tab-btn" onclick="mudarAba('Fenix', this)">FENIX</button>
    </div>

    <div class="form-container" id="formAgenda">
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="form-group">
            <label>Data</label>
            <input type="date" id="inputData" required>
        </div>
        
        <div class="form-group">
            <label>Classificação</label>
            <select id="inputClassificacao" required>
                <option value="">Selecione...</option>
                </select>
        </div>

        <div class="form-group">
            <label>Fornecedor</label>
            <input type="text" id="inputFornecedor" placeholder="Nome do fornecedor..." required>
        </div>

        <div class="form-group">
            <label>Previsão Faturamento</label>
            <select id="inputPrevisao" required>
                <option value="">Selecione...</option>
                </select>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select id="inputStatus" required>
                <option value="AGENDADO">Agendado</option>
                <option value="EXECUTADO">Executado</option>
                <option value="EXECUTADO PARCIALMENTE">Executado Parcialmente</option>
            </select>
        </div>

        <button class="btn-add" onclick="salvarAgendamento()">Salvar</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Classificação</th>
                    <th>Fornecedor</th>
                    <th>Previsão Faturamento</th>
                    <th>Status</th>
                    <th>Flag</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
