<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Compras - Ultra Assessoria</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container" id="appContainer">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">AGENDA DE COMPRAS</h2>
                <button class="close-sidebar-btn" id="btnCloseSidebar">✕</button>
            </div>
            
            <div class="sidebar-menu">
                <span class="menu-category-title">GRUPOS DE LOJAS</span>
                
                <div class="group-item" id="group-item-ZanolThomaz" data-grupo="Zanol & Thomaz">
                    <button class="menu-btn">
                        <span class="group-name">ZANOL & THOMAZ</span>
                        <span class="arrow">▾</span>
                    </button>
                    <div class="subclass-list" id="sub-list-ZanolThomaz"></div>
                </div>

                <div class="group-item" id="group-item-Cella" data-grupo="Cella">
                    <button class="menu-btn">
                        <span class="group-name">CELLA</span>
                        <span class="arrow">▾</span>
                    </button>
                    <div class="subclass-list" id="sub-list-Cella"></div>
                </div>

                <div class="group-item" id="group-item-Fenix" data-grupo="Fênix">
                    <button class="menu-btn">
                        <span class="group-name">FÊNIX</span>
                        <span class="arrow">▾</span>
                    </button>
                    <div class="subclass-list" id="sub-list-Fenix"></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-header">
<div class="header-title-group">
        <button class="hamburger-btn" id="btnToggleSidebar" title="Recolher / Expandir Menu">☰</button>
        <div>
            <h2 id="tituloAgenda">Agenda: ZANOL & THOMAZ</h2>
            <p>Gerenciamento integrado de cronogramas e faturamentos por categoria.</p>
        </div>
    </div>
    
    <button class="btn-export" id="btnExportarExcel">Exportar Excel</button>
</div>

            <div class="form-container" id="formAgenda">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="inputData" required>
                </div>
                
                <div class="form-group">
                    <label>Classificação</label>
                    <select id="inputClassificacao" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Fornecedor</label>
                    <input type="text" id="inputFornecedor" placeholder="Nome do fornecedor..." required>
                </div>

                <div class="form-group">
                    <label>Previsão Faturamento</label>
                    <select id="inputPrevisao" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="inputStatus" required>
                        <option value="AGENDADO">Agendado</option>
                        <option value="EXECUTADO">Executado</option>
                        <option value="EXECUTADO PARCIALMENTE">Executado Parcialmente</option>
                    </select>
                </div>

                <button class="btn-add" id="btnSalvarAgendamento">Salvar Registro</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Classificação</th>
                            <th>Fornecedor</th>
                            <th>Previsão Faturamento</th>
                            <th>Status</th>
                            <th>Indicador</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module" src="./assets/js/script.js"></script>
</body>
</html>
